name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      # Published by .github/workflows/docker-publish.yml
      image: ghcr.io/${{ github.repository_owner }}/greenpeas:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DGP_DEVELOPER_MODE=ON

      - name: Lint
        run: cmake --build build --target format-check

      - name: Spell check
        run: cmake --build build --target spell-check

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
